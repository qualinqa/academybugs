name: Tests and Allure Report

on:
  push:
    branches: [main, master, academybugs]
  pull_request:
    branches: [main, master, academybugs]
  # ручной запуск
  workflow_dispatch:

jobs:
  e2etests:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout кода из репозитория
      - name: checkout code
        uses: actions/checkout@v4

      # 2. Настройка Node.js
      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Установка зависимостей
      - name: Install dependencies
        run: npm install

      # 4. Установка Playwright
      - name: Install Playwright
        run: npx playwright install --with-deps

      # 5. Запуск тестов Playwright
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Сохранение отчетов Playwright
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: test-results
          path: test-results
          retention-days: 20

      # 7. Сохранение отчетов Allure
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results
          retention-days: 20

      # 8. Забрать результаты предыдущего запуска
      - name: Checkout repository
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      # 9. Генерация Allure отчёта
      - uses: simple-elf/allure-report-action@master
        if: always()
        continue-on-error: true
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # 10. Deploy отчёта
      - name: Deploy Allur report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
